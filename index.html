<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="description" content="Visualizador cartográfico de recursos naturales de Cuba - Yacimientos metálicos y no metálicos">
        <meta name="author" content="Sistema de Información Geográfica - Cuba">
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" type="text/css" href="resources/horsey.min.css">
        <link rel="stylesheet" type="text/css" href="resources/ol-search-layer.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        /* ========================================== */
        /* VARIABLES GLOBALES - FÁCIL MANTENIMIENTO  */
        /* ========================================== */
        :root {
            /* Colores principales */
            --color-primary: #ffd966;
            --color-primary-dark: #ffaa33;
            --color-primary-light: #ffe0a3;
            --color-bg-dark: rgba(0, 0, 0, 0.85);
            --color-bg-medium: rgba(0, 0, 0, 0.75);
            --color-bg-light: rgba(0, 0, 0, 0.65);
            --color-text: #ffffff;
            --color-text-secondary: #aaaaaa;
            
            /* Tamaños de botones */
            --btn-size-desktop: 30px;
            --btn-size-mobile: 38px;
            --btn-icon-size-desktop: 14px;
            --btn-icon-size-mobile: 20px;
            
            /* Bordes y sombras */
            --border-radius-sm: 6px;
            --border-radius-md: 8px;
            --border-radius-lg: 30px;
            --border-radius-xl: 40px;
            --shadow-default: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-light: 0 1px 3px rgba(0, 0, 0, 0.3);
            
            /* Z-index layers */
            --z-map: 1;
            --z-controls: 10000;
            --z-measure: 10003;
            --z-search: 10020;
            --z-title: 10030;
            
            /* Transiciones */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.2s ease;
        }
        
        /* Reset básico */
        html, body {
            background-color: #ffffff;
        }
        
        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444444 !important;
            border-radius: 0px;
        }
        
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444 !important;
        }
        
        .search-layer-input-search {
            background-color: #f8f8f8 !important;
        }
        
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7) !important;
        } 
        
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        
        /* ========================================== */
        /* === OCULTAR BÚSQUEDA ORIGINAL DE QGIS2WEB === */
        /* ========================================== */
        .search-layer, .gcd-gl-control, .ol-search-layer {
            display: none !important;
        }
        
        /* ========================================== */
        /* === BÚSQUEDA UNIFICADA === */
        /* ========================================== */
        .custom-search-container {
            position: absolute;
            top: 65px;
            left: 10px;
            z-index: var(--z-search);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .custom-search-toggle {
            background: var(--color-bg-dark);
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
            border-radius: var(--border-radius-lg);
            padding: 5px 10px;
            font-size: 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 2px;
            width: fit-content;
            transition: all var(--transition-normal);
        }
        
        .custom-search-toggle:hover {
            background: var(--color-primary);
            color: #000;
            border-color: #000;
            transform: scale(1.02);
        }
        
        /* Indicador de carga para búsqueda */
        .search-loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-left: 8px;
            border: 2px solid var(--color-primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .custom-search-panel {
            background: var(--color-bg-dark);
            border-radius: 12px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 10px;
            min-width: 280px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--color-primary);
            box-shadow: var(--shadow-default);
        }
        
        .custom-search-panel input {
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--color-primary);
            border-radius: 25px;
            padding: 12px 16px;
            font-size: 16px;
            color: #333;
            touch-action: manipulation;
            width: calc(100% - 32px);
            transition: all var(--transition-fast);
        }
        
        .custom-search-panel input:focus {
            outline: none;
            border-color: var(--color-primary-dark);
            background: #fff;
            box-shadow: 0 0 0 2px rgba(255, 217, 102, 0.2);
        }
        
        .custom-search-results {
            max-height: 300px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .custom-search-results div {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,217,102,0.3);
            color: var(--color-primary);
            cursor: pointer;
            touch-action: manipulation;
            font-size: 14px;
            transition: all var(--transition-fast);
        }
        
        .custom-search-results div:hover {
            background: rgba(255,217,102,0.2);
            transform: translateX(2px);
        }
        
        .custom-search-results div:active {
            background: rgba(255,217,102,0.4);
        }
        
        /* Mensaje de "No hay resultados" mejorado */
        .no-results-message {
            text-align: center;
            padding: 20px !important;
            color: var(--color-text-secondary) !important;
            font-style: italic;
            cursor: default !important;
        }
        
        .no-results-message:hover {
            background: transparent !important;
            transform: none !important;
        }
        
        /* ========================================== */
        /* === PANEL DE MEDICIÓN === */
        /* ========================================== */
        .measure-panel {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-bg-dark);
            color: var(--color-primary);
            padding: 10px 20px;
            border-radius: var(--border-radius-xl);
            font-size: 14px;
            font-family: monospace;
            font-weight: bold;
            z-index: var(--z-measure);
            border: 1px solid var(--color-primary);
            backdrop-filter: blur(4px);
            pointer-events: none;
            box-shadow: var(--shadow-default);
            white-space: nowrap;
            text-align: center;
            letter-spacing: 0.5px;
            transition: opacity var(--transition-normal);
        }
        
        /* ========================================== */
        /* === CONTROLES PERSONALIZADOS (BOTÓN MEDIR) === */
        /* ========================================== */
        .custom-controls {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: var(--z-controls);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .custom-controls .control-btn {
            background-color: var(--color-bg-dark);
            color: var(--color-primary);
            width: var(--btn-size-desktop);
            height: var(--btn-size-desktop);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-size: var(--btn-icon-size-desktop);
            border: 1px solid var(--color-primary);
            transition: all var(--transition-normal);
            backdrop-filter: blur(2px);
            box-shadow: var(--shadow-light);
            touch-action: manipulation;
        }
        
        .custom-controls .control-btn:hover {
            background-color: var(--color-primary);
            color: #000;
            border-color: #000;
            transform: scale(1.05);
        }
        
        .custom-controls .control-btn.active {
            background-color: var(--color-primary);
            color: #000;
            border-color: #000;
            box-shadow: 0 0 0 2px rgba(255, 217, 102, 0.3);
        }
        
        /* ========================================== */
        /* === CONTROL DE CAPAS === */
        /* ========================================== */
        .layer-switcher button {
            width: 24px !important;
            height: 24px !important;
            background-size: 16px !important;
            background-position: center !important;
            touch-action: manipulation !important;
        }
        
        .layer-switcher .panel {
            max-width: 160px !important;
            font-size: 11px !important;
        }
        
        .layer-switcher .group {
            font-size: 10px !important;
            padding: 1px 3px !important;
        }
        
        .layer-switcher .layer {
            font-size: 10px !important;
            padding: 1px 3px 1px 18px !important;
        }
        
        .layer-switcher .layer label,
        .layer-switcher .group label {
            font-size: 10px !important;
            font-weight: normal !important;
        }
        
        .layer-switcher input[type="checkbox"] {
            width: 10px !important;
            height: 10px !important;
            margin-right: 4px !important;
            transform: scale(0.9) !important;
        }
        
        .layer-switcher .layer .legend {
            width: 10px !important;
            height: 10px !important;
        }
        
        .layer-switcher .panel h3 {
            font-size: 12px !important;
            padding: 4px 8px !important;
            margin: 0 !important;
        }
        
        /* ========================================== */
        /* === PANEL DE COORDENADAS === */
        /* ========================================== */
        .coords-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: var(--color-bg-dark);
            color: var(--color-primary);
            padding: 6px 12px;
            border-radius: var(--border-radius-sm);
            font-size: 10px;
            font-family: monospace;
            z-index: var(--z-controls);
            border-left: 3px solid var(--color-primary);
            pointer-events: none;
            backdrop-filter: blur(2px);
            transition: all var(--transition-fast);
        }
        
        /* ========================================== */
        /* === BOTONES INFERIORES (CENTRO) === */
        /* ========================================== */
        .bottom-buttons {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: var(--z-controls);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .toggle-coords-btn, .clear-measure-btn {
            background: var(--color-bg-dark);
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
            cursor: pointer;
            font-family: monospace;
            backdrop-filter: blur(2px);
            transition: all var(--transition-normal);
            touch-action: manipulation;
        }
        
        .toggle-coords-btn {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
        }
        
        .clear-measure-btn {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
        }
        
        .toggle-coords-btn:hover, .clear-measure-btn:hover {
            background: var(--color-primary);
            color: #000;
            border-color: #000;
            transform: scale(1.02);
        }
        
        /* ========================================== */
        /* === ESCALA Y BOTÓN INICIO === */
        /* ========================================== */
        .bottom-right {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: var(--z-controls);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .scale-text {
            background-color: var(--color-bg-medium);
            padding: 3px 10px;
            border-radius: var(--border-radius-sm);
            color: var(--color-primary);
            font-size: 10px;
            font-family: monospace;
            pointer-events: none;
            font-weight: bold;
        }
        
        .home-button {
            background-color: var(--color-bg-dark);
            color: var(--color-primary);
            width: var(--btn-size-desktop);
            height: var(--btn-size-desktop);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 36px;
            cursor: pointer;
            font-size: 18px;
            border: 1px solid var(--color-primary);
            transition: all var(--transition-normal);
            backdrop-filter: blur(2px);
            touch-action: manipulation;
        }
        
        .home-button:hover {
            background-color: var(--color-primary);
            color: #000;
            border-color: #000;
            transform: scale(1.05);
        }
        
        /* ========================================== */
        /* === TÍTULO SUPERIOR INFORMATIVO === */
        /* ========================================== */
        .titulo-mapa {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-bg-dark);
            color: var(--color-primary);
            padding: 8px 16px;
            border-radius: var(--border-radius-lg);
            font-size: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
            text-align: center;
            z-index: var(--z-title);
            backdrop-filter: blur(4px);
            border: 1px solid var(--color-primary);
            box-shadow: var(--shadow-default);
            white-space: nowrap;
            pointer-events: none;
        }
        
        /* ========================================== */
        /* === TOAST NOTIFICATIONS === */
        /* ========================================== */
        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-bg-dark);
            color: var(--color-primary);
            padding: 8px 16px;
            border-radius: var(--border-radius-lg);
            font-size: 12px;
            font-family: monospace;
            z-index: 10050;
            border: 1px solid var(--color-primary);
            backdrop-filter: blur(4px);
            pointer-events: none;
            animation: fadeInUp 0.3s ease, fadeOut 0.3s ease 2.7s;
            white-space: nowrap;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
        
        /* ========================================== */
        /* === RESPONSIVE - VERSIÓN MÓVIL === */
        /* ========================================== */
        @media (max-width: 768px) {
            /* Ocultar elementos no esenciales en móvil */
            .bottom-buttons,
            .bottom-right {
                display: none !important;
            }
            
            /* Ajustar tamaños para móvil */
            .custom-controls .control-btn {
                width: var(--btn-size-mobile) !important;
                height: var(--btn-size-mobile) !important;
                font-size: var(--btn-icon-size-mobile) !important;
            }
            
            .custom-search-container {
                top: 45px !important;
                left: 5px !important;
            }
            
            .custom-search-toggle {
                padding: 4px 8px !important;
                font-size: 9px !important;
            }
            
            .coords-panel {
                font-size: 8px !important;
                padding: 3px 6px !important;
                bottom: 5px !important;
                left: 5px !important;
                max-width: 80% !important;
                border-left-width: 2px !important;
            }
            
            .titulo-mapa {
                font-size: 8px !important;
                padding: 3px 8px !important;
                top: 3px !important;
                white-space: normal !important;
                max-width: 92% !important;
                line-height: 1.3 !important;
            }
            
            .measure-panel {
                top: 50px !important;
                font-size: 10px !important;
                padding: 5px 12px !important;
                min-width: 160px !important;
                white-space: nowrap !important;
            }
            
            .layer-switcher button {
                width: 28px !important;
                height: 28px !important;
            }
            
            .layer-switcher .panel {
                max-width: 140px !important;
                font-size: 9px !important;
            }
            
            .toast-notification {
                font-size: 10px !important;
                padding: 6px 12px !important;
                bottom: 70px !important;
            }
        }
        </style>
        <title>Mapa de Cuba - Recursos Naturales</title>
    </head>
    <body>

<div id="map">
    <!-- ========================================== -->
    <!-- MAPA DE RECURSOS NATURALES DE CUBA v1.0    -->
    <!-- ========================================== -->
    <!-- 
    📋 DESCRIPCIÓN:
    Visualizador cartográfico de yacimientos metálicos y no metálicos
    en Cuba. Desarrollado con OpenLayers 6 y QGIS2Web.
    
    🗺️ CAPAS INCLUIDAS:
    - Áreas Protegidas
    - Cuencas de Interés Nacional  
    - Yacimientos No Metálicos
    - Yacimientos Metálicos (excluye oro y níquel)
    
    🛠️ FUNCIONALIDADES:
    - Búsqueda de lugares por nombre
    - Medición de distancias y áreas
    - Cambio de sistema de coordenadas (WGS84 / Cuba Norte EPSG:3795)
    - Escala dinámica
    
    📱 RESPONSIVE:
    - Escritorio: Funcionalidad completa
    - Móvil: Interfaz simplificada
    
    🔗 DEPENDENCIAS:
    - OpenLayers 6.5.0
    - Proj4js
    - QGIS2Web recursos locales
    -->
    
    <!-- TÍTULO SUPERIOR INFORMATIVO -->
    <div id="titulo-informativo" class="titulo-mapa">
        📊 Recursos de yacimientos no metálicos y metálicos (excepto oro y níquel). Consultar ONRM para más información
    </div>
    
    <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
    </div>
</div>
        
        <!-- BÚSQUEDA UNIFICADA -->
        <div class="custom-search-container">
            <div id="custom-search-toggle" class="custom-search-toggle">
                🔍 Buscar...
            </div>
            <div id="custom-search-panel" class="custom-search-panel">
                <input type="text" id="custom-search-input" placeholder="Escribe el nombre..." autocomplete="off">
                <div id="custom-search-results" class="custom-search-results"></div>
            </div>
        </div>
        
        <!-- BOTÓN MEDIR -->
        <div class="custom-controls">
            <div id="boton-medir" class="control-btn" title="Medir distancia / área">
                📏
            </div>
        </div>
        
        <!-- PANEL DE MEDICIÓN -->
        <div id="measure-panel" class="measure-panel" style="display:none;">
            📏 Medición: ---
        </div>
        
        <!-- PANEL DE COORDENADAS -->
        <div id="coordenadas-panel" class="coords-panel">
            📍 Toca el mapa
        </div>
        
        <!-- BOTONES INFERIORES CENTRO (visibles solo en escritorio) -->
        <div class="bottom-buttons">
            <button id="toggle-coords" class="toggle-coords-btn" title="Cambiar entre WGS84 y Cuba Norte (EPSG:3795)">
                🔄 Mostrar Cuba Norte
            </button>
            <button id="clear-measure" class="clear-measure-btn" title="Limpiar todas las mediciones">
                🗑️ Limpiar
            </button>
        </div>
        
        <!-- ESCALA Y BOTÓN INICIO (visibles solo en escritorio) -->
        <div class="bottom-right">
            <div id="escala-texto" class="scale-text">📏 1:10.000</div>
            <div id="boton-inicio" class="home-button" title="Centrar mapa en Cuba">🏠</div>
        </div>
        
        <!-- SCRIPTS ORIGINALES DE QGIS2WEB -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>
            proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');
            proj4.defs("EPSG:3795", "+proj=lcc +lat_1=23 +lat_2=21.7 +lat_0=22.35 +lon_0=-81 +x_0=500000 +y_0=280296.016 +ellps=clrk66 +towgs84=2.478,149.752,197.726,0.526356,0.497970,-0.500831,0.685238 +units=m +no_defs");
        </script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="resources/horsey.min.js"></script>
        <script src="resources/ol-search-layer.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/AREAS_PROTEGIDAS_1.js"></script>
        <script src="layers/CUENCASDEINTERESNACIONAL_2.js"></script>
        <script src="layers/YACIMIENTOSNOMETALICOS_3.js"></script>
        <script src="layers/YACIMIENTOSMETALICOS_4.js"></script>
        <script src="styles/AREAS_PROTEGIDAS_1_style.js"></script>
        <script src="styles/CUENCASDEINTERESNACIONAL_2_style.js"></script>
        <script src="styles/YACIMIENTOSNOMETALICOS_3_style.js"></script>
        <script src="styles/YACIMIENTOSMETALICOS_4_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        
        
        <!-- FUNCIONALIDAD COMPLETA -->
        <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        var mostrarCubaNorte = false;
        var measureToolActive = false;
        var drawInteraction = null;
        var measureSource = null;
        var measureLayer = null;
        var currentMeasureType = 'line';
        var searchData = [];
        var searchTimeout = null; // Para debounce en búsqueda
        
        // ============================================
        // FUNCIÓN PARA MOSTRAR NOTIFICACIONES (TOAST)
        // ============================================
        
        /**
         * Muestra una notificación temporal en pantalla
         * @param {string} mensaje - Texto a mostrar
         * @param {string} tipo - 'success', 'error', 'info' (opcional)
         */
        function mostrarNotificacion(mensaje, tipo) {
            // Eliminar notificaciones existentes
            var notificacionesExistentes = document.querySelectorAll('.toast-notification');
            notificacionesExistentes.forEach(function(notif) {
                notif.remove();
            });
            
            var toast = document.createElement('div');
            toast.className = 'toast-notification';
            
            // Icono según tipo
            var icono = 'ℹ️';
            if (tipo === 'success') icono = '✅';
            if (tipo === 'error') icono = '❌';
            
            toast.innerHTML = icono + ' ' + mensaje;
            document.body.appendChild(toast);
            
            // Eliminar después de 3 segundos
            setTimeout(function() {
                if (toast && toast.remove) {
                    toast.remove();
                }
            }, 3000);
        }
        
        // ============================================
        // FUNCIONES DE FORMATEO
        // ============================================
        
        /**
         * Convierte coordenadas a formato Grados Decimales
         * @param {number} valor - Coordenada en grados decimales
         * @param {boolean} esLon - True si es longitud, false si es latitud
         * @returns {string} Formato: "XX.XXXXX° N/E/S/O"
         */
        function formatearGradosDecimales(valor, esLon) {
            var direccion = '';
            if (esLon) {
                direccion = valor < 0 ? 'O' : 'E';
            } else {
                direccion = valor < 0 ? 'S' : 'N';
            }
            return Math.abs(valor).toFixed(5) + '° ' + direccion;
        }
        
        /**
         * Convierte coordenadas a formato Grados, Minutos, Segundos
         * @param {number} valor - Coordenada en grados decimales
         * @param {boolean} esLon - True si es longitud, false si es latitud
         * @returns {string} Formato: "XX° XX' XX.X\" N/E/S/O"
         */
        function formatearGradosMinutosSegundos(valor, esLon) {
            var absValor = Math.abs(valor);
            var grados = Math.floor(absValor);
            var minutos = Math.floor((absValor - grados) * 60);
            var segundos = ((absValor - grados) * 60 - minutos) * 60;
            
            var direccion = '';
            if (esLon) {
                direccion = valor < 0 ? 'O' : 'E';
            } else {
                direccion = valor < 0 ? 'S' : 'N';
            }
            
            return grados + '° ' + minutos + "' " + segundos.toFixed(1) + '" ' + direccion;
        }
        
        /**
         * Formatea números con separadores de miles
         * @param {number} valor - Número a formatear
         * @returns {string} Número formateado
         */
        function formatearNumero(valor) {
            return Math.round(valor).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        /**
         * Formatea distancias en metros o kilómetros
         * @param {number} distancia - Distancia en metros
         * @returns {string} Distancia formateada
         */
        function formatearDistancia(distancia) {
            if (distancia >= 1000) {
                return (distancia / 1000).toFixed(2) + ' km';
            }
            return distancia.toFixed(1) + ' m';
        }
        
        /**
         * Formatea áreas en m², ha o km²
         * @param {number} area - Área en metros cuadrados
         * @returns {string} Área formateada
         */
        function formatearArea(area) {
            if (area >= 1000000) {
                return (area / 1000000).toFixed(2) + ' km²';
            } else if (area >= 10000) {
                return (area / 10000).toFixed(2) + ' ha';
            }
            return area.toFixed(1) + ' m²';
        }
        
        // ============================================
        // EXTRACCIÓN DE DATOS PARA BÚSQUEDA
        // ============================================
        
        function extraerDatosBusqueda() {
            console.log("🔍 Extrayendo datos para búsqueda...");
            
            if (typeof map !== 'undefined' && map.getLayers) {
                var layers = map.getLayers().getArray();
                layers.forEach(function(layer) {
                    if (layer.getSource && layer.getSource().getFeatures) {
                        var source = layer.getSource();
                        var features = source.getFeatures();
                        var layerName = layer.get('name') || layer.get('title') || 'Capa';
                        
                        features.forEach(function(feature) {
                            var props = feature.getProperties();
                            var posiblesCampos = ['NOMBRE', 'NOMBRE_1', 'name', 'Name', 'NOM', 'DESCRIP', 'YACIMIENTO', 'CUENCA', 'AREA'];
                            var nombre = null;
                            
                            for (var i = 0; i < posiblesCampos.length; i++) {
                                if (props[posiblesCampos[i]]) {
                                    nombre = props[posiblesCampos[i]];
                                    break;
                                }
                            }
                            
                            if (nombre && typeof nombre === 'string' && nombre.length > 0) {
                                searchData.push({
                                    nombre: nombre,
                                    geometry: feature.getGeometry(),
                                    capa: layerName
                                });
                            }
                        });
                    }
                });
            }
            
            console.log("✅ Datos extraídos:", searchData.length, "elementos");
            if (searchData.length === 0) {
                mostrarNotificacion('No se encontraron datos para búsqueda', 'error');
            }
        }
        
        function buscarEnCapas(texto) {
            if (!texto || texto.length < 2) return [];
            var textoLower = texto.toLowerCase();
            return searchData.filter(function(item) {
                return item.nombre.toLowerCase().includes(textoLower);
            }).slice(0, 20);
        }
        
        function centrarEnGeometria(geometry) {
            if (!geometry) {
                console.warn('⚠️ Geometría no válida');
                mostrarNotificacion('Error: geometría no válida', 'error');
                return;
            }
            
            try {
                if (geometry.getType() === 'Point') {
                    var coords = geometry.getCoordinates();
                    if (coords && coords.length === 2) {
                        map.getView().setCenter(coords);
                        map.getView().setZoom(12);
                        mostrarNotificacion('📍 Ubicación encontrada', 'success');
                    }
                } else {
                    var extent = geometry.getExtent();
                    if (extent && !isNaN(extent[0])) {
                        map.getView().fit(extent, { padding: [50, 50, 50, 50] });
                        mostrarNotificacion('🗺️ Área encontrada', 'success');
                    }
                }
            } catch (error) {
                console.error('❌ Error centrando geometría:', error);
                mostrarNotificacion('Error al centrar el elemento', 'error');
            }
        }
        
        // ============================================
        // FUNCIONES DE MEDICIÓN
        // ============================================
        
        function crearHerramientaMedicion() {
            measureSource = new ol.source.Vector();
            measureLayer = new ol.layer.Vector({
                source: measureSource,
                style: new ol.style.Style({
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 217, 102, 0.2)'
                    }),
                    stroke: new ol.style.Stroke({
                        color: '#ffd966',
                        width: 3
                    }),
                    image: new ol.style.Circle({
                        radius: 5,
                        fill: new ol.style.Fill({
                            color: '#ffd966'
                        })
                    })
                })
            });
            map.addLayer(measureLayer);
        }
        
        function activarMedicion(tipo) {
            if (measureToolActive) {
                desactivarMedicion();
            }
            
            currentMeasureType = tipo;
            measureToolActive = true;
            
            measureSource.clear();
            document.getElementById('measure-panel').style.display = 'none';
            document.getElementById('clear-measure').style.display = 'none';
            
            if (drawInteraction) {
                map.removeInteraction(drawInteraction);
            }
            
            drawInteraction = new ol.interaction.Draw({
                source: measureSource,
                type: tipo === 'line' ? 'LineString' : 'Polygon',
                style: new ol.style.Style({
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 217, 102, 0.2)'
                    }),
                    stroke: new ol.style.Stroke({
                        color: '#ffd966',
                        width: 3
                    }),
                    image: new ol.style.Circle({
                        radius: 5,
                        fill: new ol.style.Fill({
                            color: '#ffd966'
                        })
                    })
                })
            });
            
            drawInteraction.on('drawend', function(event) {
                var geometry = event.feature.getGeometry();
                var output;
                
                if (tipo === 'line') {
                    var length = ol.sphere.getLength(geometry, {projection: map.getView().getProjection()});
                    output = '📏 ' + formatearDistancia(length);
                    mostrarNotificacion('📏 Distancia medida: ' + formatearDistancia(length), 'success');
                } else {
                    var area = ol.sphere.getArea(geometry, {projection: map.getView().getProjection()});
                    output = '📐 ' + formatearArea(area);
                    mostrarNotificacion('📐 Área medida: ' + formatearArea(area), 'success');
                }
                
                var panel = document.getElementById('measure-panel');
                panel.innerHTML = output;
                panel.style.display = 'block';
                document.getElementById('clear-measure').style.display = 'inline-block';
                
                setTimeout(function() {
                    if (panel.style.display === 'block') {
                        panel.style.opacity = '0.6';
                        setTimeout(function() {
                            if (panel.style.display === 'block') {
                                panel.style.display = 'none';
                                panel.style.opacity = '1';
                            }
                        }, 1500);
                    }
                }, 4000);
            });
            
            map.addInteraction(drawInteraction);
            
            var btnMedir = document.getElementById('boton-medir');
            if (btnMedir) {
                btnMedir.classList.add('active');
            }
            
            map.getTargetElement().style.cursor = 'crosshair';
            
            var mensaje = tipo === 'line' ? '✅ Modo medición: dibuja una línea' : '✅ Modo medición: dibuja un polígono';
            mostrarNotificacion(mensaje, 'info');
        }
        
        function desactivarMedicion() {
            if (drawInteraction) {
                map.removeInteraction(drawInteraction);
                drawInteraction = null;
            }
            measureToolActive = false;
            
            var btnMedir = document.getElementById('boton-medir');
            if (btnMedir) {
                btnMedir.classList.remove('active');
            }
            
            map.getTargetElement().style.cursor = '';
        }
        
        function limpiarMediciones() {
            if (measureSource) {
                measureSource.clear();
            }
            document.getElementById('measure-panel').style.display = 'none';
            document.getElementById('clear-measure').style.display = 'none';
            
            if (measureToolActive) {
                desactivarMedicion();
            }
            mostrarNotificacion('🧹 Mediciones limpiadas', 'info');
        }
        
        function mostrarMenuMedicion() {
            var opciones = confirm("Selecciona tipo de medición:\n\nOK → Medir distancia (línea)\nCancelar → Medir área (polígono)");
            
            if (opciones) {
                activarMedicion('line');
            } else {
                activarMedicion('area');
            }
        }
        
        // ============================================
        // ACTUALIZAR PANEL DE COORDENADAS
        // ============================================
        
        function actualizarPanelCoordenadas(lon, lat) {
            var panel = document.getElementById('coordenadas-panel');
            var toggleBtn = document.getElementById('toggle-coords');
            
            if (mostrarCubaNorte) {
                try {
                    var cubaCoords = proj4('EPSG:4326', 'EPSG:3795', [lon, lat]);
                    
                    panel.innerHTML = 
                        '🇨🇺 <strong style="color:#ffaa33;">EPSG:3795 (Cuba Norte)</strong><br>' +
                        'X: ' + formatearNumero(cubaCoords[0]) + ' m<br>' +
                        'Y: ' + formatearNumero(cubaCoords[1]) + ' m<br>' +
                        '<span style="font-size:10px; color:#aaa;">🌐 WGS84: ' + 
                        formatearGradosDecimales(lon, true) + ', ' + 
                        formatearGradosDecimales(lat, false) + '</span>';
                    
                    if (toggleBtn) toggleBtn.innerHTML = '🔄 Mostrar WGS84';
                    
                } catch(e) {
                    console.error("Error conversión a Cuba Norte:", e);
                    panel.innerHTML = '❌ Error en conversión a EPSG:3795';
                }
            } else {
                panel.innerHTML = 
                    '📍 <strong style="color:#ffaa33;">WGS84 (EPSG:4326)</strong><br>' +
                    '🗺️ Grados Decimales:<br>' +
                    'Longitud: ' + formatearGradosDecimales(lon, true) + '<br>' +
                    'Latitud: ' + formatearGradosDecimales(lat, false) + '<br>' +
                    '<span style="font-size:10px; color:#aaa;">📐 Grados, Minutos, Segundos:<br>' +
                    formatearGradosMinutosSegundos(lon, true) + ', ' + 
                    formatearGradosMinutosSegundos(lat, false) + '</span>';
                
                if (toggleBtn) toggleBtn.innerHTML = '🔄 Mostrar Cuba Norte';
            }
        }
        
        // ============================================
        // CONFIGURAR BÚSQUEDA UNIFICADA CON FEEDBACK
        // ============================================
        
        function configurarBusqueda() {
            var toggleBtn = document.getElementById('custom-search-toggle');
            var panel = document.getElementById('custom-search-panel');
            var searchInput = document.getElementById('custom-search-input');
            var resultsDiv = document.getElementById('custom-search-results');
            
            if (!toggleBtn || !panel) return;
            
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (panel.style.display === 'flex') {
                    panel.style.display = 'none';
                } else {
                    panel.style.display = 'flex';
                    setTimeout(function() { searchInput.focus(); }, 100);
                }
            });
            
            searchInput.addEventListener('input', function(e) {
                var texto = this.value;
                
                // Limpiar timeout anterior
                if (searchTimeout) clearTimeout(searchTimeout);
                
                if (texto.length < 2) {
                    resultsDiv.innerHTML = '';
                    return;
                }
                
                // Mostrar indicador de carga
                resultsDiv.innerHTML = '<div class="search-loading" style="margin: 20px auto;"></div>';
                
                // Debounce para evitar búsquedas excesivas
                searchTimeout = setTimeout(function() {
                    var resultados = buscarEnCapas(texto);
                    resultsDiv.innerHTML = '';
                    
                    if (resultados.length === 0) {
                        resultsDiv.innerHTML = '<div class="no-results-message">🔍 No hay resultados para "' + texto + '"</div>';
                    } else {
                        resultados.forEach(function(res) {
                            var div = document.createElement('div');
                            div.innerHTML = res.nombre + ' <span style="font-size:10px; color:#aaa;">(' + res.capa + ')</span>';
                            div.addEventListener('click', function(e) {
                                e.stopPropagation();
                                centrarEnGeometria(res.geometry);
                                panel.style.display = 'none';
                                searchInput.value = '';
                                resultsDiv.innerHTML = '';
                            });
                            resultsDiv.appendChild(div);
                        });
                    }
                }, 300);
            });
            
            document.addEventListener('click', function(e) {
                if (!panel.contains(e.target) && e.target !== toggleBtn) {
                    panel.style.display = 'none';
                }
            });
            
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && resultsDiv.firstChild) {
                    var firstResult = resultsDiv.firstChild;
                    if (firstResult && firstResult.click && !firstResult.classList.contains('no-results-message')) {
                        firstResult.click();
                    }
                }
            });
        }
        
        // ============================================
        // INICIALIZACIÓN DEL MAPA
        // ============================================
        
        function inicializarMapa() {
            if (typeof map === 'undefined') {
                setTimeout(inicializarMapa, 500);
                return;
            }
            
            console.log("✅ Mapa inicializado");
            mostrarNotificacion('🗺️ Mapa cargado correctamente', 'success');
            
            crearHerramientaMedicion();
            desactivarMedicion();
            
            setTimeout(function() {
                extraerDatosBusqueda();
                configurarBusqueda();
            }, 1000);
            
            map.on('click', function(evt) {
                if (measureToolActive) return;
                
                var coordenadas = evt.coordinate;
                var lon = coordenadas[0];
                var lat = coordenadas[1];
                
                actualizarPanelCoordenadas(lon, lat);
            });
            
            var btnMedir = document.getElementById('boton-medir');
            if (btnMedir) {
                btnMedir.onclick = function() {
                    if (measureToolActive) {
                        desactivarMedicion();
                        limpiarMediciones();
                    } else {
                        mostrarMenuMedicion();
                    }
                };
            }
            
            var clearBtn = document.getElementById('clear-measure');
            if (clearBtn) {
                clearBtn.onclick = function() {
                    limpiarMediciones();
                };
            }
            
            var toggleBtn = document.getElementById('toggle-coords');
            if (toggleBtn) {
                toggleBtn.onclick = function() {
                    mostrarCubaNorte = !mostrarCubaNorte;
                    var center = map.getView().getCenter();
                    if (center) {
                        actualizarPanelCoordenadas(center[0], center[1]);
                    }
                    var mensaje = mostrarCubaNorte ? '🔄 Formato: Cuba Norte (EPSG:3795)' : '🔄 Formato: WGS84';
                    mostrarNotificacion(mensaje, 'info');
                };
            }
            
            var btn = document.getElementById('boton-inicio');
            if (btn) {
                btn.onclick = function() {
                    map.getView().setCenter([-79.0, 21.5]);
                    map.getView().setZoom(6);
                    actualizarPanelCoordenadas(-79.0, 21.5);
                    mostrarNotificacion('🏠 Vista centrada en Cuba', 'success');
                };
            }
            
            var escalaDiv = document.getElementById('escala-texto');
            if (escalaDiv && map.getView()) {
                function actualizarEscala() {
                    try {
                        var zoom = map.getView().getZoom();
                        var texto = '';
                        if (zoom >= 18) texto = '📏 1:1.000';
                        else if (zoom >= 17) texto = '📏 1:2.000';
                        else if (zoom >= 16) texto = '📏 1:4.000';
                        else if (zoom >= 15) texto = '📏 1:8.000';
                        else if (zoom >= 14) texto = '📏 1:15.000';
                        else if (zoom >= 13) texto = '📏 1:30.000';
                        else if (zoom >= 12) texto = '📏 1:60.000';
                        else if (zoom >= 11) texto = '📏 1:120.000';
                        else if (zoom >= 10) texto = '📏 1:250.000';
                        else if (zoom >= 9) texto = '📏 1:500.000';
                        else if (zoom >= 8) texto = '📏 1:1.000.000';
                        else if (zoom >= 7) texto = '📏 1:2.000.000';
                        else if (zoom >= 6) texto = '📏 1:4.000.000';
                        else texto = '📏 1:20.000.000';
                        
                        escalaDiv.innerHTML = texto;
                    } catch(e) {}
                }
                
                actualizarEscala();
                map.getView().on('change:resolution', actualizarEscala);
            }
            
            document.getElementById('coordenadas-panel').innerHTML = 
                '📍 Toca el mapa - WGS84 (EPSG:4326)<br>' +
                '🔍 Buscar (izquierda) | 📏 Medir (derecha)';
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(inicializarMapa, 800);
            });
        } else {
            setTimeout(inicializarMapa, 800);
        }
        </script>
    </body>
