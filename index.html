        <script src="resources/qgis2web_expressions.js"></script>

        <script>
            proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');
            proj4.defs("EPSG:3795", "+proj=lcc +lat_1=23 +lat_2=21.7 +lat_0=22.35 +lon_0=-81 +x_0=500000 +y_0=280296.016 +ellps=clrk66 +towgs84=2.478,149.752,197.726,0.526356,0.497970,-0.500831,0.685238 +units=m +no_defs");

        <!-- ========================================== -->
        <!-- === REPARACIÓN PARA ANDROID: FORZAR BÚSQUEDA === -->
        <!-- ========================================== -->
        <script>
        (function() {
            // Esta función fuerza que la búsqueda funcione en táctil
            function repararBusquedaAndroid() {
                setTimeout(function() {
                    var searchInput = document.querySelector('.search-layer-input-search, .gcd-gl-input');
                    
                    if (searchInput) {
                        console.log("🔍 Reparando búsqueda para Android...");
                        
                        // Forzar atributos
                        searchInput.setAttribute('autocomplete', 'off');
                        searchInput.setAttribute('autocorrect', 'off');
                        searchInput.setAttribute('autocapitalize', 'none');
                        searchInput.setAttribute('spellcheck', 'false');
                        searchInput.style.pointerEvents = 'auto';
                        
                        // Eliminar eventos anteriores y re-asignar
                        var oldInput = searchInput;
                        var newInput = searchInput.cloneNode(true);
                        oldInput.parentNode.replaceChild(newInput, oldInput);
                        searchInput = newInput;
                        
                        // Forzar evento input para activar Horsey
                        searchInput.addEventListener('input', function(e) {
                            console.log("Input detectado:", this.value);
                            // Disparar evento personalizado para Horsey
                            var event = new Event('input', { bubbles: true });
                            this.dispatchEvent(event);
                        });
                        
                        searchInput.addEventListener('focus', function(e) {
                            console.log("Focus en búsqueda");
                            // Si ya hay texto, forzar la búsqueda
                            if (this.value.length > 0) {
                                var event = new Event('input', { bubbles: true });
                                this.dispatchEvent(event);
                            }
                        });
                        
                        searchInput.addEventListener('touchstart', function(e) {
                            console.log("Touch en búsqueda");
                            // No prevenir para permitir foco
                        }, { passive: true });
                        
                        console.log("✅ Búsqueda reparada para Android");
                    } else {
                        console.log("⏳ Buscando campo de búsqueda...");
                        setTimeout(repararBusquedaAndroid, 500);
                    }
                }, 1000);
            }
            
            // También asegurar que el mapa esté listo
            function esperarMapa() {
                if (typeof map !== 'undefined') {
                    console.log("Mapa listo - reparando búsqueda");
                    repararBusquedaAndroid();
                } else {
                    setTimeout(esperarMapa, 300);
                }
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', esperarMapa);
            } else {
                esperarMapa();
            }
        })();
        </script>
        
        <!-- ========================================== -->
        <!-- === PERSONALIZACIONES COMPLETAS === -->
        <!-- ========================================== -->
        <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        var mostrarCubaNorte = false;
        var measureToolActive = false;
        var drawInteraction = null;
        var measureSource = null;
        var measureLayer = null;
        var currentMeasureType = 'line';
        
        // ============================================
        // FUNCIONES DE FORMATEO
        // ============================================
        
        function formatearGradosDecimales(valor, esLon) {
            var direccion = '';
            if (esLon) {
                direccion = valor < 0 ? 'O' : 'E';
            } else {
                direccion = valor < 0 ? 'S' : 'N';
            }
            return Math.abs(valor).toFixed(5) + '° ' + direccion;
        }
        
        function formatearGradosMinutosSegundos(valor, esLon) {
            var absValor = Math.abs(valor);
            var grados = Math.floor(absValor);
            var minutos = Math.floor((absValor - grados) * 60);
            var segundos = ((absValor - grados) * 60 - minutos) * 60;
            
            var direccion = '';
            if (esLon) {
                direccion = valor < 0 ? 'O' : 'E';
            } else {
                direccion = valor < 0 ? 'S' : 'N';
            }
            
            return grados + '° ' + minutos + "' " + segundos.toFixed(1) + '" ' + direccion;
        }
        
        function formatearNumero(valor) {
            return Math.round(valor).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        function formatearDistancia(distancia) {
            if (distancia >= 1000) {
                return (distancia / 1000).toFixed(2) + ' km';
            }
            return distancia.toFixed(1) + ' m';
        }
        
        function formatearArea(area) {
            if (area >= 1000000) {
                return (area / 1000000).toFixed(2) + ' km²';
            } else if (area >= 10000) {
                return (area / 10000).toFixed(2) + ' ha';
            }
            return area.toFixed(1) + ' m²';
        }
        
        // ============================================
        // FUNCIONES DE MEDICIÓN
        // ============================================
        
        function crearHerramientaMedicion() {
            measureSource = new ol.source.Vector();
            measureLayer = new ol.layer.Vector({
                source: measureSource,
                style: new ol.style.Style({
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 217, 102, 0.2)'
                    }),
                    stroke: new ol.style.Stroke({
                        color: '#ffd966',
                        width: 3
                    }),
                    image: new ol.style.Circle({
                        radius: 5,
                        fill: new ol.style.Fill({
                            color: '#ffd966'
                        })
                    })
                })
            });
            map.addLayer(measureLayer);
        }
        
        function activarMedicion(tipo) {
            if (measureToolActive) {
                desactivarMedicion();
            }
            
            currentMeasureType = tipo;
            measureToolActive = true;
            
            measureSource.clear();
            document.getElementById('measure-panel').style.display = 'none';
            document.getElementById('clear-measure').style.display = 'none';
            
            if (drawInteraction) {
                map.removeInteraction(drawInteraction);
            }
            
            drawInteraction = new ol.interaction.Draw({
                source: measureSource,
                type: tipo === 'line' ? 'LineString' : 'Polygon',
                style: new ol.style.Style({
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 217, 102, 0.2)'
                    }),
                    stroke: new ol.style.Stroke({
                        color: '#ffd966',
                        width: 3
                    }),
                    image: new ol.style.Circle({
                        radius: 5,
                        fill: new ol.style.Fill({
                            color: '#ffd966'
                        })
                    })
                })
            });
            
            drawInteraction.on('drawend', function(event) {
                var geometry = event.feature.getGeometry();
                var output;
                
                if (tipo === 'line') {
                    var length = ol.sphere.getLength(geometry, {projection: map.getView().getProjection()});
                    output = '📏 ' + formatearDistancia(length);
                } else {
                    var area = ol.sphere.getArea(geometry, {projection: map.getView().getProjection()});
                    output = '📐 ' + formatearArea(area);
                }
                
                var panel = document.getElementById('measure-panel');
                panel.innerHTML = output;
                panel.style.display = 'block';
                document.getElementById('clear-measure').style.display = 'inline-block';
                
                setTimeout(function() {
                    if (panel.style.display === 'block') {
                        panel.style.opacity = '0.6';
                        setTimeout(function() {
                            if (panel.style.display === 'block') {
                                panel.style.display = 'none';
                                panel.style.opacity = '1';
                            }
                        }, 1500);
                    }
                }, 4000);
            });
            
            map.addInteraction(drawInteraction);
            
            var btnMedir = document.getElementById('boton-medir');
            if (btnMedir) {
                btnMedir.classList.add('active');
            }
            
            map.getTargetElement().style.cursor = 'crosshair';
            console.log("📏 Herramienta de medición activada:", tipo);
        }
        
        function desactivarMedicion() {
            if (drawInteraction) {
                map.removeInteraction(drawInteraction);
                drawInteraction = null;
            }
            measureToolActive = false;
            
            var btnMedir = document.getElementById('boton-medir');
            if (btnMedir) {
                btnMedir.classList.remove('active');
            }
            
            map.getTargetElement().style.cursor = '';
            console.log("📏 Herramienta de medición desactivada");
        }
        
        function limpiarMediciones() {
            if (measureSource) {
                measureSource.clear();
            }
            document.getElementById('measure-panel').style.display = 'none';
            document.getElementById('clear-measure').style.display = 'none';
            
            if (measureToolActive) {
                desactivarMedicion();
            }
        }
        
        function mostrarMenuMedicion() {
            var opciones = confirm("Selecciona tipo de medición:\n\nOK → Medir distancia (línea)\nCancelar → Medir área (polígono)");
            
            if (opciones) {
                activarMedicion('line');
            } else {
                activarMedicion('area');
            }
        }
        
        // ============================================
        // ACTUALIZAR PANEL DE COORDENADAS
        // ============================================
        
        function actualizarPanelCoordenadas(lon, lat) {
            var panel = document.getElementById('coordenadas-panel');
            var toggleBtn = document.getElementById('toggle-coords');
            
            if (mostrarCubaNorte) {
                try {
                    var cubaCoords = proj4('EPSG:4326', 'EPSG:3795', [lon, lat]);
                    
                    panel.innerHTML = 
                        '🇨🇺 <strong style="color:#ffaa33;">EPSG:3795 (Cuba Norte)</strong><br>' +
                        'X: ' + formatearNumero(cubaCoords[0]) + ' m<br>' +
                        'Y: ' + formatearNumero(cubaCoords[1]) + ' m<br>' +
                        '<span style="font-size:10px; color:#aaa;">🌐 WGS84: ' + 
                        formatearGradosDecimales(lon, true) + ', ' + 
                        formatearGradosDecimales(lat, false) + '</span>';
                    
                    if (toggleBtn) toggleBtn.innerHTML = '🔄 Mostrar WGS84';
                    
                } catch(e) {
                    console.error("Error conversión a Cuba Norte:", e);
                    panel.innerHTML = '❌ Error en conversión a EPSG:3795';
                }
            } else {
                panel.innerHTML = 
                    '📍 <strong style="color:#ffaa33;">WGS84 (EPSG:4326)</strong><br>' +
                    '🗺️ Grados Decimales:<br>' +
                    'Longitud: ' + formatearGradosDecimales(lon, true) + '<br>' +
                    'Latitud: ' + formatearGradosDecimales(lat, false) + '<br>' +
                    '<span style="font-size:10px; color:#aaa;">📐 Grados, Minutos, Segundos:<br>' +
                    formatearGradosMinutosSegundos(lon, true) + ', ' + 
                    formatearGradosMinutosSegundos(lat, false) + '</span>';
                
                if (toggleBtn) toggleBtn.innerHTML = '🔄 Mostrar Cuba Norte';
            }
        }
        
        // ============================================
        // INICIALIZACIÓN DEL MAPA
        // ============================================
        
        function inicializarMapa() {
            if (typeof map === 'undefined') {
                setTimeout(inicializarMapa, 500);
                return;
            }
            
            console.log("✅ Mapa inicializado en WGS84 (EPSG:4326)");
            
            crearHerramientaMedicion();
            desactivarMedicion();
            
            map.on('click', function(evt) {
                if (measureToolActive) return;
                
                var coordenadas = evt.coordinate;
                var lon = coordenadas[0];
                var lat = coordenadas[1];
                
                actualizarPanelCoordenadas(lon, lat);
            });
            
            var btnMedir = document.getElementById('boton-medir');
            if (btnMedir) {
                btnMedir.onclick = function() {
                    if (measureToolActive) {
                        desactivarMedicion();
                        limpiarMediciones();
                    } else {
                        mostrarMenuMedicion();
                    }
                };
            }
            
            var clearBtn = document.getElementById('clear-measure');
            if (clearBtn) {
                clearBtn.onclick = function() {
                    limpiarMediciones();
                };
            }
            
            var toggleBtn = document.getElementById('toggle-coords');
            if (toggleBtn) {
                toggleBtn.onclick = function() {
                    mostrarCubaNorte = !mostrarCubaNorte;
                    var center = map.getView().getCenter();
                    if (center) {
                        actualizarPanelCoordenadas(center[0], center[1]);
                    }
                };
            }
            
            var btn = document.getElementById('boton-inicio');
            if (btn) {
                btn.onclick = function() {
                    map.getView().setCenter([-79.0, 21.5]);
                    map.getView().setZoom(6);
                    actualizarPanelCoordenadas(-79.0, 21.5);
                };
            }
            
            var escalaDiv = document.getElementById('escala-texto');
            if (escalaDiv && map.getView()) {
                function actualizarEscala() {
                    try {
                        var zoom = map.getView().getZoom();
                        var texto = '';
                        if (zoom >= 18) texto = '📏 1:1.000';
                        else if (zoom >= 17) texto = '📏 1:2.000';
                        else if (zoom >= 16) texto = '📏 1:4.000';
                        else if (zoom >= 15) texto = '📏 1:8.000';
                        else if (zoom >= 14) texto = '📏 1:15.000';
                        else if (zoom >= 13) texto = '📏 1:30.000';
                        else if (zoom >= 12) texto = '📏 1:60.000';
                        else if (zoom >= 11) texto = '📏 1:120.000';
                        else if (zoom >= 10) texto = '📏 1:250.000';
                        else if (zoom >= 9) texto = '📏 1:500.000';
                        else if (zoom >= 8) texto = '📏 1:1.000.000';
                        else if (zoom >= 7) texto = '📏 1:2.000.000';
                        else if (zoom >= 6) texto = '📏 1:4.000.000';
                        else texto = '📏 1:20.000.000';
                        
                        escalaDiv.innerHTML = texto;
                    } catch(e) {}
                }
                
                actualizarEscala();
                map.getView().on('change:resolution', actualizarEscala);
            }
            
            document.getElementById('coordenadas-panel').innerHTML = 
                '📍 Toca el mapa - WGS84 (EPSG:4326)<br>' +
                '🔄 Botón inferior: Cuba Norte | 📏 Botón arriba derecha: Medir';
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(inicializarMapa, 800);
            });
        } else {
            setTimeout(inicializarMapa, 800);
        }
        </script>
    </body>
</html>
